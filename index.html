<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNOU Examination Portal - Login</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #2f4f88, #1e3c72);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.header {
    padding: 20px;
}

.logo {
    width: 120px;
    animation: spin 8s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

h1 {
    font-size: 24px;
    margin-top: 10px;
}

.marquee {
    font-size: 18px;
    margin-top: 10px;
    color: #ffd700;
}

.container {
    background: #fff;
    width: 350px;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.container h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1e3c72;
}

#error {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
    <img src="https://help12.in/images/student1.png" class="logo">
    
    <h1>Computerised IGNOU Examination Management Portal</h1>

    <div class="marquee">
        <marquee>Welcome to IGNOU Examination Management System</marquee>
    </div>
</div>

<div class="container">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>

    <button onclick="login()">Login</button>

    <div id="error"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCKIBH21BAb8xd2b4XqboAEI2484EIf-D8",
    authDomain: "fir-88622.firebaseapp.com",
    projectId: "fir-88622"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
    .then(() => {
        alert("Login Successful");
        window.location.href = "dashboard.html";
    })
    .catch((error) => {
        document.getElementById("error").innerText = error.message;
    });
};
</script>

  
</body>
</html>
