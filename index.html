<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNOU Examination Portal - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #2f4f88, #1e3c72);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: #ffffff;
    width: 360px;
    padding: 30px 25px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    text-align: center;
}

.container h2 {
    margin-bottom: 20px;
    color: #222;
    font-weight: 600;
}

.container input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 15px;
    transition: 0.3s;
}

.container input:focus {
    border-color: #2f4f88;
    outline: none;
    box-shadow: 0 0 5px rgba(47,79,136,0.3);
}

.container button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    background: #2f4f88;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
}

.container button:hover {
    background: #1e3c72;
}

#error {
    margin-top: 10px;
    font-size: 14px;
    color: red;
}

@media (max-width: 400px) {
    .container {
        width: 90%;
        padding: 25px 20px;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="https://help12.in/images/student1.png" class="logo">
    
    <h1>Computerised IGNOU Examination Management Portal</h1>

    <div class="marquee">
        <marquee>Welcome to IGNOU Examination Management System</marquee>
    </div>
</div>

<div class="container">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>

    <button onclick="login()">Login</button>

    <div id="error"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCKIBH21BAb8xd2b4XqboAEI2484EIf-D8",
    authDomain: "fir-88622.firebaseapp.com",
    projectId: "fir-88622"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
    .then(() => {
        alert("Login Successful");
        window.location.href = "dashboard.html";
    })
    .catch((error) => {
        document.getElementById("error").innerText = error.message;
    });
};
</script>

  
</body>
</html>
